name: build

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Checkout uhppote-core
      run: git clone https://github.com/deteppohu/uhppoted-core.git uhppote-core

    - name: Checkout uhppoted-lib
      run: git clone https://github.com/deteppohu/uhppoted-lib.git uhppoted-lib

    - name: Checkout uhppote-simulator
      run: git clone https://github.com/deteppohu/uhppote-simulator.git uhppote-simulator

    - name: Checkout uhppote-cli
      run: git clone https://github.com/deteppohu/uhppote-cli.git uhppote-cli

    - name: Checkout uhppoted-rest
      run: git clone https://github.com/deteppohu/uhppoted-rest.git uhppoted-rest

    - name: Checkout uhppoted-mqtt
      run: git clone https://github.com/deteppohu/uhppoted-mqtt.git uhppoted-mqtt

    - name: Checkout uhppoted-httpd
      run: git clone https://github.com/deteppohu/uhppoted-httpd.git uhppoted-httpd

    - name: Checkout uhppoted-tunnel
      run: git clone https://github.com/deteppohu/uhppoted-tunnel.git uhppoted-tunnel

    - name: Checkout uhppoted-codegen
      run: git clone https://github.com/deteppohu/uhppoted-codegen.git uhppoted-codegen

    - name: Checkout uhppoted-app-s3
      run: git clone https://github.com/deteppohu/uhppoted-app-s3.git uhppoted-app-s3

    - name: Checkout uhppoted-app-sheets
      run: git clone https://github.com/deteppohu/uhppoted-app-sheets.git uhppoted-app-sheets

    - name: Checkout uhppoted-app-wild-apricot
      run: git clone https://github.com/deteppohu/uhppoted-app-wild-apricot.git uhppoted-app-wild-apricot

    - name: Checkout uhppoted-app-db
      run: git clone https://github.com/deteppohu/uhppoted-app-db.git uhppoted-app-db

    - name: Build
      run: make build-github
